name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          unzip -o project.zip -d temp_extract
          SOURCE_DIR=$(find temp_extract -name "package.json" -printf '%h\n' | head -n 1)
          cp -r "$SOURCE_DIR"/. .
          mkdir -p src

      - name: Preserve Custom App Code
        run: |
          if [ -f "App.tsx" ]; then
            cp App.tsx src/App.tsx
          elif [ -f "src/App.tsx" ]; then
            echo "Using existing src/App.tsx"
          fi
          
          if [ ! -f "src/main.tsx" ] && [ ! -f "src/main.jsx" ]; then
            echo 'import React from "react"; import ReactDOM from "react-dom/client"; import App from "./App"; ReactDOM.createRoot(document.getElementById("root")!).render(<React.StrictMode><App /></React.StrictMode>);' > src/main.tsx
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Project Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/cli @capacitor/core @capacitor/android
          npm install @capacitor/app @capacitor/status-bar

      - name: Build Web Assets
        run: npm run build

      - name: Initialize Android and Apply Icon
        run: |
          npx cap add android || true
          
          # اگر فایل icon.png آپلود شده باشد، جایگزین آیکون اصلی اندروید می‌شود
          if [ -f "icon.png" ]; then
            echo "Generating app icons..."
            for dir in android/app/src/main/res/mipmap-*; do
              if [ -d "$dir" ]; then
                convert icon.png -resize 192x192 "$dir/ic_launcher.png"
                convert icon.png -resize 192x192 "$dir/ic_launcher_round.png"
                convert icon.png -resize 192x192 "$dir/ic_launcher_foreground.png"
              fi
            done
          fi

          echo "subprojects { configurations.all { resolutionStrategy { force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.10' } } }" >> android/build.gradle
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: load-management-app
          path: android/app/build/outputs/apk/debug/app-debug.apk
