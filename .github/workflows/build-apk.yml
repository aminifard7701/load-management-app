name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract Project ZIP and Preserve Edits
        run: |
          mkdir -p repo_src_backup
          cp -r src/* repo_src_backup/ || true
          cp App.tsx repo_app_backup.tsx || true
          
          unzip -o project.zip -d temp_extract
          SOURCE_DIR=$(find temp_extract -name "package.json" -printf '%h\n' | head -n 1)
          cp -r "$SOURCE_DIR"/. .
          mkdir -p src
          
          if [ -d "repo_src_backup" ] && [ "$(ls -A repo_src_backup)" ]; then
            cp -r repo_src_backup/* src/
          fi
          if [ -f "repo_app_backup.tsx" ]; then
            cp repo_app_backup.tsx src/App.tsx
          fi

      - name: Set App Name
        run: |
          APP_NAME="مدیریت تخلیه بار"
          echo '{"appId": "com.loadmanagement.app", "appName": "'"$APP_NAME"'", "webDir": "dist", "bundledWebRuntime": false}' > capacitor.config.json

      - name: Ensure Main Entry Exists
        run: |
          if [ ! -f "src/main.tsx" ] && [ ! -f "src/main.jsx" ]; then
            echo 'import React from "react"; import ReactDOM from "react-dom/client"; import App from "./App"; ReactDOM.createRoot(document.getElementById("root")!).render(<React.StrictMode><App /></React.StrictMode>);' > src/main.tsx
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Project Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/cli @capacitor/core @capacitor/android
          npm install @capacitor/app @capacitor/status-bar @capacitor/filesystem @capacitor/share
        run: npm run build

      - name: Initialize Android and Apply Name & Icon
        run: |
          npx cap add android || true
          
          APP_NAME="مدیریت تخلیه بار"
          sed -i "s/<string name=\"app_name\">.*<\/string>/<string name=\"app_name\">$APP_NAME<\/string>/" android/app/src/main/res/values/strings.xml || true
          sed -i "s/<string name=\"title_activity_main\">.*<\/string>/<string name=\"title_activity_main\">$APP_NAME<\/string>/" android/app/src/main/res/values/strings.xml || true

          # تزریق مجوزهای حیاتی برای ذخیره‌سازی فایل در اندروید
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" \/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" \/>' "$MANIFEST" || true
          fi
sed -i '/<application/i \    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" \/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" \/>' "$MANIFEST" || true# افزایش حافظه برای جلوگیری از کرش هنگام ساخت PDF و عکس
sed -i 's/<application/<application android:largeHeap="true"/' "$MANIFEST" || true
          if [ -f "icon.png" ]; then
            sudo apt-get update && sudo apt-get install -y imagemagick
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
            for dir in android/app/src/main/res/mipmap-*; do
              if [ -d "$dir" ]; then
                convert icon.png -resize 192x192 "$dir/ic_launcher.png"
                convert icon.png -resize 192x192 "$dir/ic_launcher_round.png"
                convert icon.png -resize 192x192 "$dir/ic_launcher_foreground.png"
              fi
            done
          fi

          echo "subprojects { configurations.all { resolutionStrategy { force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'; force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'; force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22' } } }" >> android/build.gradle
          npx cap sync android

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign Release APK
        run: |
          cd android/app/build/outputs/apk/release
          keytool -genkey -v -keystore release.keystore -alias app-alias -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=LoadManager, OU=App, O=Amini, C=IR"
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
          $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore --ks-pass pass:123456 --out app-release.apk app-release-unsigned.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: load-management-app-release
          path: android/app/build/outputs/apk/release/app-release.apk
