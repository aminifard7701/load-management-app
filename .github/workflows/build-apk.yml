name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract and Fix Project Structure
        run: |
          # استخراج فایل ZIP
          unzip -o project.zip -d temp_extract
          
          # پیدا کردن پوشه‌ای که حاوی package.json است (حتی با نام فارسی و فاصله)
          SOURCE_DIR=$(find temp_extract -name "package.json" -printf '%h\n' | head -n 1)
          
          # کپی کردن محتویات آن پوشه به مسیر اصلی با رعایت فواصل
          cp -r "$SOURCE_DIR"/. .
          
          # ساخت پوشه src اگر وجود ندارد و انتقال App.tsx به داخل آن
          mkdir -p src
          if [ -f "App.tsx" ]; then
            mv "App.tsx" src/App.tsx
          fi
          
          # اطمینان از وجود فایل اصلی برای Vite
          if [ ! -f "src/main.tsx" ] && [ ! -f "src/main.jsx" ]; then
            echo 'import React from "react"; import ReactDOM from "react-dom/client"; import App from "./App"; ReactDOM.createRoot(document.getElementById("root")!).render(<React.StrictMode><App /></React.StrictMode>);' > src/main.tsx
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Assets
        run: npm run build

      - name: Add and Sync Android Platform
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: load-management-app
          path: android/app/build/outputs/apk/debug/app-debug.apk
