name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract and Fix Project Structure
        run: |
          mkdir temp_zip
          unzip -o project.zip -d temp_zip
          
          # پیدا کردن پوشه اصلی حاوی package.json و انتقال فایل‌ها به ریشه
          PKG_DIR=$(find temp_zip -name "package.json" -exec dirname {} \; | head -n 1)
          if [ -n "$PKG_DIR" ]; then
            cp -r $PKG_DIR/* .
          fi
          
          # اصلاح ساختار src در صورت نیاز
          mkdir -p src
          if [ -f "App.tsx" ]; then
            mv App.tsx src/App.tsx
          fi
          
          # ساخت main.tsx در صورت عدم وجود
          if [ ! -f "src/main.tsx" ] && [ ! -f "src/main.jsx" ]; then
            echo 'import React from "react"; import ReactDOM from "react-dom/client"; import App from "./App"; ReactDOM.createRoot(document.getElementById("root")!).render(<React.StrictMode><App /></React.StrictMode>);' > src/main.tsx
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Assets
        run: npm run build

      - name: Add and Sync Android Platform
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: load-management-app
          path: android/app/build/outputs/apk/debug/app-debug.apk
