name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract and Fix Project Structure
        run: |
          unzip -o -q project.zip -d temp_extract
          SOURCE_DIR=$(find temp_extract -name "package.json" -not -path "*/node_modules/*" -printf '%h\n' | head -n 1)
          echo "Project folder: $SOURCE_DIR"
          cp -r "$SOURCE_DIR"/. .
          rm -rf temp_extract node_modules android
          mkdir -p src
          if [ -f "App.tsx" ] && [ ! -f "src/App.tsx" ]; then mv "App.tsx" src/App.tsx; fi
          if [ ! -f "src/main.tsx" ] && [ ! -f "src/main.jsx" ]; then
            echo 'import React from "react"; import ReactDOM from "react-dom/client"; import App from "./App"; ReactDOM.createRoot(document.getElementById("root")!).render(<React.StrictMode><App /></React.StrictMode>);' > src/main.tsx
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --legacy-peer-deps @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Build Web Assets
        run: npm run build

      - name: Create Fresh Android Project
        run: |
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            echo '{"appId": "com.example.loadmanagement", "appName": "LoadManagement", "webDir": "dist"}' > capacitor.config.json
          fi
          npx cap add android
          npx cap sync android

      - name: Fix Kotlin Duplicate Classes
        run: |
          cat >> android/app/build.gradle <<'EOF'

          dependencies {
              implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
          }
          EOF

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: load-management-app
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
